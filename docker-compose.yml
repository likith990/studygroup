services:
  server:
    build: ./server
    env_file: ./server/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: http://localhost:8080
    ports:
      - "5173:80"   # keep 5173 so CLIENT_URL and Google OAuth settings stay the same
    depends_on:
      - server
    restart: unless-stopped
